services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: go_api_auth
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d go_api_auth"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    entrypoint: ["/migrate", "up"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/go_api_auth?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    environment:
      APP_ENV: development
      PORT: "8080"
      DATABASE_URL: postgres://postgres:postgres@db:5432/go_api_auth?sslmode=disable
      JWT_SECRET: dev-secret-change-me-32-bytes-minimum!!
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
